<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Branchly 앱 아이콘: 둥근 사각형 + 갈라지는 커밋 줄기 (scripts/make-icon.mjs가 build/icon.png로 그림) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7dff"/>
      <stop offset="1" stop-color="#8a5cf6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#shine)"/>
  <g fill="none" stroke="#ffffff" stroke-width="72" stroke-linecap="round">
    <!-- 왼쪽 줄기 -->
    <path d="M384 300 V724"/>
    <!-- 오른쪽 가지: 위 커밋에서 내려와 줄기로 합류 -->
    <path d="M656 372 C656 520 384 512 384 640"/>
  </g>
  <g fill="#ffffff">
    <circle cx="384" cy="272" r="76"/>
    <circle cx="656" cy="344" r="76"/>
    <circle cx="384" cy="752" r="76"/>
  </g>
  <g fill="#6a6cf9">
    <circle cx="384" cy="272" r="30"/>
    <circle cx="656" cy="344" r="30"/>
    <circle cx="384" cy="752" r="30"/>
  </g>
</svg>
